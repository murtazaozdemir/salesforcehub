<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Background -->
  <rect width="1200" height="1200" rx="240" fill="#059669"/>

  <!-- Magnifying glass circle -->
  <circle cx="520" cy="500" r="220" fill="none" stroke="white" stroke-width="56"/>

  <!-- Magnifying glass handle -->
  <line x1="680" y1="660" x2="860" y2="840" stroke="white" stroke-width="56" stroke-linecap="round"/>

  <!-- Checkmark inside magnifying glass -->
  <polyline points="420,500 490,570 620,440" fill="none" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small bar chart lines (bottom right, suggesting data/audit) -->
  <rect x="780" y="920" width="56" height="120" rx="12" fill="white" opacity="0.7"/>
  <rect x="860" y="880" width="56" height="160" rx="12" fill="white" opacity="0.8"/>
  <rect x="940" y="840" width="56" height="200" rx="12" fill="white" opacity="0.9"/>
</svg>
